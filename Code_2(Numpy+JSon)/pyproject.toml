[project]
name = "version-aware-rag"
version = "0.1.0"
description = "A RAG system with version-aware retrieval and conflict detection"
authors = ["Your Name <you@example.com>"]
license = "MIT"
requires-python = ">=3.11"

[project.dependencies]
sentence-transformers = ">=2.2.0"
pypdf = ">=4.0.0"
python-docx = ">=1.1.0"
unstructured = ">=0.10.0"
qdrant-client = ">=1.6.0"
fastapi = ">=0.100.0"
uvicorn = ">=0.27.0"
streamlit = ">=1.30.0"
pytest = ">=7.0.0"
rank-bm25 = ">=0.2.2"
transformers = ">=4.30.0"
torch = ">=2.0.0"
redis = ">=4.5.0"
python-dotenv = ">=1.0.0"

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
